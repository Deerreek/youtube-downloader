<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.4rem; }
    input[type="text"], select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f1f1f1;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #ff4e4e;
    }
    .row { display: flex; gap: 1rem; }
    .row > div { flex: 1; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4e4e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
    }
    button:hover { background: #e03e3e; }
    button:disabled { background: #555; cursor: not-allowed; }
    #progress-wrap { margin-top: 1rem; display: none; }
    #progress-bg { background: #222; border-radius: 6px; height: 6px; overflow: hidden; }
    #progress-bar { height: 100%; background: #ff4e4e; width: 0%; transition: width 0.3s ease; }
    #status { margin-top: 0.6rem; font-size: 0.85rem; color: #888; min-height: 1.2rem; }
    .flash {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
    }
    .flash.success { background: #1a3a1a; border: 1px solid #2e6b2e; color: #6fcf6f; }
    .flash.error   { background: #3a1a1a; border: 1px solid #6b2e2e; color: #cf6f6f; }
    .history { margin-top: 2.5rem; }
    .history h2 { font-size: 1rem; color: #aaa; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: #666; font-weight: 500; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2e2e2e; }
    td { padding: 0.5rem 0.6rem; border-bottom: 1px solid #1e1e1e; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-audio { background: #1a2a3a; color: #6ab0cf; }
    .badge-video { background: #2a1a3a; color: #b06acf; }
    .empty { color: #555; font-size: 0.85rem; text-align: center; padding: 1.5rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>YouTube Downloader</h1>
    <p class="subtitle">Paste a YouTube URL and hit Download</p>

    <div id="flash-area"></div>

    <form method="POST" action="/download" id="form">
      <label for="url">YouTube URL</label>
      <input type="text" id="url" name="url" placeholder="https://youtu.be/..." required />

      <div class="row">
        <div>
          <label for="mode">Mode</label>
          <select id="mode" name="mode">
            <option value="audio">Audio (MP3)</option>
            <option value="video">Video (MP4)</option>
          </select>
        </div>
        <div>
          <label for="quality">Quality</label>
          <select id="quality" name="quality">
            <option value="best">Best</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
      </div>

      <button type="submit" id="btn">Download</button>
    </form>

    <div id="progress-wrap">
      <div id="progress-bg"><div id="progress-bar"></div></div>
      <div id="status"></div>
    </div>

    <div class="history" id="history-section">
      <h2>Download History</h2>
      {% if history %}
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Mode</th>
              <th>Quality</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            {% for item in history %}
            <tr>
              <td title="{{ item.title }}">{{ item.title }}</td>
              <td><span class="badge badge-{{ item.mode }}">{{ item.mode }}</span></td>
              <td>{{ item.quality }}</td>
              <td>{{ item.timestamp }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      {% else %}
        <p class="empty">No downloads yet.</p>
      {% endif %}
    </div>
  </div>

  <script>
    function showFlash(message, type) {
      const area = document.getElementById("flash-area");
      area.innerHTML = `<div class="flash ${type}">${message}</div>`;
    }

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();

      const btn = document.getElementById("btn");
      const progressWrap = document.getElementById("progress-wrap");
      const progressBar = document.getElementById("progress-bar");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "Downloading…";
      progressWrap.style.display = "block";
      progressBar.style.width = "0%";
      status.textContent = "Starting…";
      document.getElementById("flash-area").innerHTML = "";

      fetch("/download", { method: "POST", body: new FormData(this) })
        .then(r => r.json())
        .then(({ job_id, error }) => {
          if (error) {
            showFlash(error, "error");
            btn.disabled = false;
            btn.textContent = "Download";
            progressWrap.style.display = "none";
            return;
          }

          const es = new EventSource(`/progress/${job_id}`);
          es.onmessage = function (e) {
            const data = JSON.parse(e.data);

            if (data.status === "downloading") {
              progressBar.style.width = data.percent + "%";
              status.textContent = `Downloading… ${data.percent}%`;
            } else if (data.status === "processing") {
              progressBar.style.width = "99%";
              status.textContent = "Processing…";
            } else if (data.status === "done") {
              progressBar.style.width = "100%";
              status.textContent = "Done!";
              es.close();
              setTimeout(() => location.reload(), 800);
            } else if (data.status === "error") {
              showFlash("Download failed: " + (data.message || "Unknown error."), "error");
              progressBar.style.width = "0%";
              progressWrap.style.display = "none";
              btn.disabled = false;
              btn.textContent = "Download";
              es.close();
            }
          };
        });
    });
  </script>
</body>
</html>
